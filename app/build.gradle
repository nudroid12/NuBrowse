plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvbrowser.tv'
    compileSdk 35

    buildFeatures {
        resValues = true
    }

    defaultConfig {
        applicationId 'com.tvbrowser.tv'
        minSdk 23
        targetSdk 35
        versionCode 13
        def updateRepo = System.getenv('GITHUB_REPOSITORY') ?: 'nudroid12/TVBrowser'
        resValue 'string', 'update_repo', updateRepo
        versionName '0.0.3'
    }

    def signingFile = System.getenv('TVBROWSER_KEYSTORE_FILE')
    if (signingFile) {
        signingConfigs {
            updates {
                storeFile file(signingFile)
                storePassword System.getenv('TVBROWSER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TVBROWSER_KEY_ALIAS')
                keyPassword storePassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            if (signingFile) signingConfig signingConfigs.updates
        }
        release {
            if (signingFile) signingConfig signingConfigs.updates
        }
    }

    def adapterSources = rootProject.file('tvadapter')
    if (adapterSources.isDirectory()) {
        sourceSets {
            debug.java.srcDir adapterSources
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(3)
        }
    }
}
