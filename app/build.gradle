plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nudroidlabs.nubrowse'
    compileSdk 35

    buildFeatures {
        resValues = true
    }

    defaultConfig {
        applicationId 'com.tvbrowser.tv'
        minSdk 23
        targetSdk 35
        versionCode 9
        def updateRepo = System.getenv('GITHUB_REPOSITORY') ?: ''
        resValue 'string', 'update_repo', updateRepo
        versionName '1.6.0'
    }

    def signingFile = System.getenv('TVBROWSER_KEYSTORE_FILE')
    if (signingFile) {
        signingConfigs {
            release {
                storeFile file(signingFile)
                storePassword System.getenv('TVBROWSER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TVBROWSER_KEY_ALIAS')
                keyPassword storePassword
            }
        }
    }

    buildTypes {
        release {
            if (signingFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
