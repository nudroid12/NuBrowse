name: TVBrowser Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Build a signed APK and publish it to GitHub Releases
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_run:
    workflows: [Apply ZIP Patch]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.asset }}
    steps:
      - name: Get applied commit
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: nubrowse-applied-sha
          path: ${{ runner.temp }}/nubrowse-apply
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select build commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            revision="$(cat "$RUNNER_TEMP/nubrowse-apply/nubrowse-applied-sha.txt")"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Refresh network blocklist for APK
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          tmp_hosts="$(mktemp)"
          tmp_domains="$(mktemp)"
          tmp_license="$(mktemp)"
          cleanup() { rm -f "$tmp_hosts" "$tmp_domains" "$tmp_license"; }
          trap cleanup EXIT

          hosts_url="https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          license_url="https://raw.githubusercontent.com/StevenBlack/hosts/master/license.txt"

          if curl -fsSL --retry 3 --connect-timeout 10 --max-time 90 "$hosts_url" -o "$tmp_hosts" \
             && curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 "$license_url" -o "$tmp_license"; then
            awk '
              /^[[:space:]]*#/ { next }
              NF >= 2 && ($1 == "0.0.0.0" || $1 == "127.0.0.1") &&
              $2 !~ /^#/ && $2 != "localhost" && $2 != "localhost.localdomain" && $2 != "0.0.0.0" {
                print tolower($2)
              }
            ' "$tmp_hosts" | sort -u > "$tmp_domains"

            rules="$(wc -l < "$tmp_domains" | tr -d ' ')"
            if [ "${rules:-0}" -ge 1000 ]; then
              cp "$tmp_domains" app/src/main/assets/blocked_hosts.txt
              cp "$tmp_license" app/src/main/assets/StevenBlack-LICENSE.txt
              echo "NuBrowse network blocklist ready: $rules host rules."
            else
              echo "Downloaded blocklist looked incomplete. Using bundled fallback rules."
            fi
          else
            echo "Blocklist download unavailable. Using bundled fallback rules."
          fi

      - name: Build debug APK
        if: ${{ !inputs.publish }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TVBrowser-debug.apk
      - name: Upload debug APK
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v5
        with:
          name: TVBrowser-debug
          path: TVBrowser-debug.apk
          if-no-files-found: error
      - name: Build signed release APK
        if: inputs.publish && github.ref == 'refs/heads/main'
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.TVBROWSER_KEYSTORE_BASE64 }}
          TVBROWSER_KEYSTORE_PASSWORD: ${{ secrets.TVBROWSER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$TVBROWSER_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the TVBrowser signing secrets before publishing."
            exit 1
          fi
          umask 077
          export TVBROWSER_KEYSTORE_FILE
          TVBROWSER_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/tvbrowser-keystore.XXXXXX")"
          trap 'rm -f -- "$TVBROWSER_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TVBROWSER_KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          key_reader="$(mktemp -d "$RUNNER_TEMP/tvbrowser-key-reader.XXXXXX")"
          trap 'rm -f -- "$TVBROWSER_KEYSTORE_FILE"; rm -rf -- "$key_reader"' EXIT
          cat > "$key_reader/ReadSigningAlias.java" <<'JAVA'
          import java.io.File;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.util.ArrayList;
          import java.util.List;

          class ReadSigningAlias {
              public static void main(String[] args) throws Exception {
                  char[] password = System.getenv("TVBROWSER_KEYSTORE_PASSWORD").toCharArray();
                  KeyStore store = KeyStore.getInstance(new File(args[0]), password);
                  List<String> aliases = new ArrayList<>();
                  var entries = store.aliases();
                  while (entries.hasMoreElements()) {
                      String alias = entries.nextElement();
                      if (store.entryInstanceOf(alias, KeyStore.PrivateKeyEntry.class)) {
                          aliases.add(alias);
                      }
                  }
                  if (aliases.size() != 1) {
                      throw new IllegalArgumentException("Use a keystore with one signing key.");
                  }
                  String alias = aliases.get(0);
                  if (!(store.getKey(alias, password) instanceof PrivateKey)) {
                      throw new IllegalArgumentException("Use the same password for the key and keystore.");
                  }
                  System.out.print(alias);
              }
          }
          JAVA
          TVBROWSER_KEY_ALIAS="$(java "$key_reader/ReadSigningAlias.java" "$TVBROWSER_KEYSTORE_FILE")"
          export TVBROWSER_KEY_ALIAS
          gradle --no-daemon --stacktrace assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          metadata="$("$tools/aapt" dump badging "$apk")"
          package_line="${metadata%%$'\n'*}"
          [[ "$package_line" == "package: name='com.tvbrowser.tv' "* ]]
          code="$(sed -nE "s/.* versionCode='([0-9]+)'.*/\1/p" <<< "$package_line")"
          version="$(sed -nE "s/.* versionName='([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" <<< "$package_line")"
          [[ "$code" =~ ^[1-9][0-9]{0,8}$ && -n "$version" ]]
          asset="TVBrowser-$code.apk"
          cp "$apk" "$asset"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: TVBrowser-release
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: TVBrowser-release
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "TVBrowser $TAG" --generate-notes --latest
