name: TVBrowser Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Build a signed APK and publish it to GitHub Releases
        type: boolean
        default: false
      publish_debug:
        description: Publish a signed debug APK to the debug update channel
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tvadapter/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-tvbrowser.yml'
  workflow_run:
    workflows: [TVBrowser Apply ZIP Patch]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.release_asset }}
      debug_asset: ${{ steps.release.outputs.debug_asset }}
    steps:
      - name: Get applied commit
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: tvbrowser-applied-sha
          path: ${{ runner.temp }}/tvbrowser-apply
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select build commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            revision="$(cat "$RUNNER_TEMP/tvbrowser-apply/tvbrowser-applied-sha.txt")"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk" ]]; then
            sdk="$RUNNER_TEMP/android-sdk"
          fi
          mkdir -p "$sdk"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"

          missing=()
          [[ -s "$sdk/platforms/android-35/android.jar" ]] || missing+=('platforms;android-35')
          if [[ ! -x "$sdk/build-tools/36.0.0/aapt" || ! -x "$sdk/build-tools/36.0.0/apksigner" ]]; then
            missing+=('build-tools;36.0.0')
          fi
          if (( ${#missing[@]} == 0 )); then
            echo "Android SDK packages already installed at $sdk"
            exit 0
          fi

          manager="$(command -v sdkmanager || true)"
          if [[ -z "$manager" ]]; then
            shopt -s nullglob
            for candidate in "$sdk"/cmdline-tools/latest/bin/sdkmanager "$sdk"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                manager="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$manager" ]]; then
            cli="$(mktemp -d "$RUNNER_TEMP/android-cli.XXXXXX")"
            trap 'rm -rf -- "$cli"' EXIT
            curl --fail --silent --show-error --location --retry 3 \
              'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' \
              -o "$cli/tools.zip"
            unzip -q "$cli/tools.zip" -d "$cli"
            manager="$cli/cmdline-tools/bin/sdkmanager"
          fi
          # yes can get SIGPIPE when sdkmanager finishes reading.
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk" --install "${missing[@]}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/36.0.0/aapt"
          test -x "$sdk/build-tools/36.0.0/apksigner"
      - name: Refresh network blocklist for APK
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          tmp_hosts="$(mktemp)"
          tmp_domains="$(mktemp)"
          tmp_license="$(mktemp)"
          cleanup() { rm -f "$tmp_hosts" "$tmp_domains" "$tmp_license"; }
          trap cleanup EXIT

          hosts_url="https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          license_url="https://raw.githubusercontent.com/StevenBlack/hosts/master/license.txt"

          if curl -fsSL --retry 3 --connect-timeout 10 --max-time 90 "$hosts_url" -o "$tmp_hosts" \
             && curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 "$license_url" -o "$tmp_license"; then
            awk '
              /^[[:space:]]*#/ { next }
              NF >= 2 && ($1 == "0.0.0.0" || $1 == "127.0.0.1") &&
              $2 !~ /^#/ && $2 != "localhost" && $2 != "localhost.localdomain" && $2 != "0.0.0.0" {
                print tolower($2)
              }
            ' "$tmp_hosts" | sort -u > "$tmp_domains"

            rules="$(wc -l < "$tmp_domains" | tr -d ' ')"
            if [ "${rules:-0}" -ge 1000 ]; then
              cp "$tmp_domains" app/src/main/assets/blocked_hosts.txt
              cp "$tmp_license" app/src/main/assets/StevenBlack-LICENSE.txt
              echo "TVBrowser network blocklist ready: $rules host rules."
            else
              echo "Downloaded blocklist looked incomplete. Using bundled fallback rules."
            fi
          else
            echo "Blocklist download unavailable. Using bundled fallback rules."
          fi

      - name: Build signed debug and release APKs
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.TVBROWSER_KEYSTORE_BASE64 }}
          TVBROWSER_KEYSTORE_PASSWORD: ${{ secrets.TVBROWSER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$TVBROWSER_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the TVBrowser signing secrets before building."
            exit 1
          fi
          umask 077
          export TVBROWSER_KEYSTORE_FILE
          TVBROWSER_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/tvbrowser-keystore.XXXXXX")"
          trap 'rm -f -- "$TVBROWSER_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TVBROWSER_KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          key_reader="$(mktemp -d "$RUNNER_TEMP/tvbrowser-key-reader.XXXXXX")"
          trap 'rm -f -- "$TVBROWSER_KEYSTORE_FILE"; rm -rf -- "$key_reader"' EXIT
          cat > "$key_reader/ReadSigningAlias.java" <<'JAVA'
          import java.io.File;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.util.ArrayList;
          import java.util.List;

          class ReadSigningAlias {
              public static void main(String[] args) throws Exception {
                  char[] password = System.getenv("TVBROWSER_KEYSTORE_PASSWORD").toCharArray();
                  KeyStore store = KeyStore.getInstance(new File(args[0]), password);
                  List<String> aliases = new ArrayList<>();
                  var entries = store.aliases();
                  while (entries.hasMoreElements()) {
                      String alias = entries.nextElement();
                      if (store.entryInstanceOf(alias, KeyStore.PrivateKeyEntry.class)) {
                          aliases.add(alias);
                      }
                  }
                  if (aliases.size() != 1) {
                      throw new IllegalArgumentException("Use a keystore with one signing key.");
                  }
                  String alias = aliases.get(0);
                  if (!(store.getKey(alias, password) instanceof PrivateKey)) {
                      throw new IllegalArgumentException("Use the same password for the key and keystore.");
                  }
                  System.out.print(alias);
              }
          }
          JAVA
          TVBROWSER_KEY_ALIAS="$(java "$key_reader/ReadSigningAlias.java" "$TVBROWSER_KEYSTORE_FILE")"
          export TVBROWSER_KEY_ALIAS
          gradle --no-daemon --stacktrace assembleDebug assembleRelease
          for variant in debug release; do
            package=com.tvbrowser.tv
            prefix=TVBrowser
            if [[ "$variant" == debug ]]; then
              package=com.tvbrowser.tv.debug
              prefix=TVBrowser-debug
            fi
            apk="app/build/outputs/apk/$variant/app-$variant.apk"
            tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}/build-tools/36.0.0"
            "$tools/apksigner" verify "$apk"
            metadata="$("$tools/aapt" dump badging "$apk")"
            package_line="${metadata%%$'\n'*}"
            [[ "$package_line" == "package: name='$package' "* ]]
            code="$(sed -nE "s/.* versionCode='([0-9]+)'.*/\1/p" <<< "$package_line")"
            version="$(sed -nE "s/.* versionName='([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" <<< "$package_line")"
            [[ "$code" =~ ^[1-9][0-9]{0,8}$ && -n "$version" ]]
            asset="$prefix-$code.apk"
            cp "$apk" "$asset"
            if [[ "$variant" == release ]]; then
              echo "tag=v$version" >> "$GITHUB_OUTPUT"
            fi
            echo "${variant}_asset=$asset" >> "$GITHUB_OUTPUT"
          done
      - name: Upload signed APKs
        uses: actions/upload-artifact@v5
        with:
          name: TVBrowser-signed
          path: |
            ${{ steps.release.outputs.debug_asset }}
            ${{ steps.release.outputs.release_asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: TVBrowser-signed
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          python3 - <<'PYFEED'
          import json
          import os
          import re

          tag = os.environ["TAG"]
          apk = os.environ["ASSET"]
          match = re.fullmatch(r"TVBrowser-([1-9][0-9]{0,8})[.]apk", apk)
          if not match or not re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+", tag):
              raise SystemExit("Invalid TVBrowser release metadata")
          repo = os.environ["GITHUB_REPOSITORY"]
          with open("update.json", "w", encoding="utf-8") as output:
              json.dump({
                  "tag": tag,
                  "versionName": tag[1:],
                  "versionCode": int(match[1]),
                  "downloadUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk}",
              }, output)
          PYFEED
          gh release create "$TAG" "$ASSET" update.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "TVBrowser $TAG" --generate-notes --latest

  publish-debug:
    needs: build
    if: inputs.publish_debug && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: tvbrowser-debug-updates
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: TVBrowser-signed
      - name: Publish debug update
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.build.outputs.debug_asset }}
        run: |
          set -euo pipefail
          [[ "$ASSET" =~ ^TVBrowser-debug-[1-9][0-9]{0,8}[.]apk$ ]]
          if gh release view debug-updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload debug-updates "$ASSET" --repo "$GITHUB_REPOSITORY"
          else
            gh release create debug-updates "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "TVBrowser Debug Updates" --prerelease --latest=false
          fi
