              private void showUserAgentPicker() {
                  String[] modes = {"TV", "Desktop", "Mobile"};
                  new AlertDialog.Builder(this)
                          .setTitle("User agent")
                          .setSingleChoiceItems(modes, uaIndex(), (dialog, which) -> {
                              uaMode = modes[which];
                              applyUserAgent();
                              saveSettings();
                              dialog.dismiss();
                              webView.reload();
                          })
