      - name: Commit M2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle gradle.properties .gitignore app
          if git diff --cached --quiet; then
            echo "M2 source already current."
          else
            git commit -m "NuBrowse M2 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Preflight GitHub runner and Android SDK
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > preflight.log
          echo "Runner: ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset}" | tee -a preflight.log

          java -version 2>&1 | tee -a preflight.log
          java_code=${PIPESTATUS[0]}
          if [ "$java_code" -ne 0 ]; then
            echo "NUBROWSE_PREFLIGHT_ERROR: Java 17 setup unavailable" | tee -a preflight.log
            echo "exit_code=$java_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gradle --version 2>&1 | tee -a preflight.log
          gradle_code=${PIPESTATUS[0]}
          if [ "$gradle_code" -ne 0 ]; then
            echo "NUBROWSE_PREFLIGHT_ERROR: Gradle 9.4.1 setup unavailable" | tee -a preflight.log
            echo "exit_code=$gradle_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Resolved SDK=$SDK" | tee -a preflight.log
          if [ ! -d "$SDK" ]; then
            echo "NUBROWSE_PREFLIGHT_ERROR: Android SDK root missing: $SDK" | tee -a preflight.log
            echo "exit_code=121" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi

          NEED_PLATFORM=0
          NEED_BUILD_TOOLS=0
          [ -d "$SDK/platforms/android-35" ] || NEED_PLATFORM=1
          [ -d "$SDK/build-tools/36.0.0" ] || NEED_BUILD_TOOLS=1

          if [ "$NEED_PLATFORM" -ne 0 ] || [ "$NEED_BUILD_TOOLS" -ne 0 ]; then
            if [ -z "$SDKMANAGER" ]; then
              echo "NUBROWSE_PREFLIGHT_ERROR: Required SDK package missing and sdkmanager unavailable" | tee -a preflight.log
              echo "exit_code=127" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0" 2>&1 | tee -a preflight.log
            sdk_code=${PIPESTATUS[0]}
            if [ "$sdk_code" -ne 0 ]; then
              echo "NUBROWSE_PREFLIGHT_ERROR: Android SDK fallback install failed with exit code $sdk_code" | tee -a preflight.log
              echo "exit_code=$sdk_code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          [ -d "$SDK/platforms/android-35" ] || { echo "NUBROWSE_PREFLIGHT_ERROR: platforms;android-35 unavailable" | tee -a preflight.log; echo "exit_code=125" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -d "$SDK/build-tools/36.0.0" ] || { echo "NUBROWSE_PREFLIGHT_ERROR: build-tools;36.0.0 unavailable" | tee -a preflight.log; echo "exit_code=126" >> "$GITHUB_OUTPUT"; exit 0; }

          echo "NUBROWSE_PREFLIGHT_OK: runner and Android SDK ready" | tee -a preflight.log
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build Debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          : > build.log
          if [ "${{ steps.preflight.outputs.exit_code }}" != "0" ]; then
            cat preflight.log | tee -a build.log
            echo "NUBROWSE_BUILD_ERROR: Preflight failed, build not started." | tee -a build.log
            code=90
          else
            gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build diagnose summary
        if: always()
        shell: bash
        env:
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
          PREFLIGHT_EXIT_CODE: ${{ steps.preflight.outputs.exit_code }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, re
          from pathlib import Path
          exit_code=os.environ.get("BUILD_EXIT_CODE") or "unknown"
          preflight_code=os.environ.get("PREFLIGHT_EXIT_CODE") or "unknown"
          chunks=[]
          for fn in ('build.log','preflight.log'):
              p=Path(fn)
              if p.exists(): chunks.append(p.read_text(errors='replace'))
          text='\n'.join(chunks)
          lines=text.splitlines()
          patterns=[
              r'NUBROWSE_(?:BUILD|PREFLIGHT)_ERROR:.+',
              r'.*(?:\.kt|\.java|\.xml):\d+(?::\d+)?.*(?:error|Error|ERROR|Unresolved|Cannot|failed|Failed).*',
              r'^e: .+', r'.*\berror:\s+.+', r'.*AAPT(?:2)?.*error.*',
              r'.*Manifest merger failed.*', r'.*Could not (?:resolve|find|determine|download).*',
              r'.*Execution failed for task .*', r'.*Caused by: .*',
              r'.*SDK location not found.*', r'.*Failed to find target with hash string.*',
              r'.*package .* does not exist.*', r'.*Could not install.*'
          ]
          regs=[re.compile(x,re.I) for x in patterns]
          noise=re.compile(r'deprecated|warning:|daemon|from-cache|up-to-date',re.I)
          found=[]
          for line in lines:
              s=line.strip()
              if not s or noise.search(s): continue
              if any(r.search(s) for r in regs) and s not in found: found.append(s)
              if len(found)>=12: break
          failed='not detected'
          for line in lines:
              m=re.search(r"Execution failed for task ['\"]([^'\"]+)['\"]",line)
              if m: failed=m.group(1); break
          joined='\n'.join(found).lower()
          kind='Build/Gradle'
          if preflight_code not in ('0','unknown'): kind='Environment / Android SDK'
          elif '.kt:' in joined or 'kotlin' in joined: kind='Kotlin compilation'
          elif '.java:' in joined or 'javac' in joined or 'compiler.err' in joined: kind='Java compilation'
          elif 'manifest' in joined: kind='Android manifest'
          elif 'aapt' in joined or '.xml:' in joined or 'resource' in joined: kind='Android resources'
          elif 'could not resolve' in joined or 'could not find' in joined: kind='Dependency resolution'
          ok=exit_code=='0'
          print('## NUBROWSE BUILD DIAGNOSE')
          print('```text')
          print('NUBROWSE BUILD DIAGNOSE')
          print('========================')
          print(f"RESULT: {'SUCCESS' if ok else 'FAILED'}")
          print(f'BUILD EXIT CODE: {exit_code}')
          print(f'PREFLIGHT EXIT CODE: {preflight_code}')
          if ok:
              print('APK: NuBrowse-M2-debug.apk')
          else:
              print(f'ERROR TYPE: {kind}')
              print(f'FAILED TASK: {failed}')
              print('\nPRIMARY ERROR')
              print(found[0] if found else 'No recognised error line. Copy the last 25 lines below.')
              if len(found)>1:
                  print('\nRELEVANT ERRORS')
                  for i,x in enumerate(found[1:8],1): print(f'{i}. {x}')
              if not found:
                  print('\nLAST 25 LOG LINES')
                  for x in lines[-25:]: print(x)
          print('```')
          PY

      - name: Prepare APK name
        if: steps.build.outputs.exit_code == '0'
        run: cp app/build/outputs/apk/debug/app-debug.apk NuBrowse-M2-debug.apk

      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v5
        with:
          name: NuBrowse-M2-debug
          path: NuBrowse-M2-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload full log backup
        if: steps.build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v5
        with:
          name: nubrowse-m2-full-build-log
          path: build.log
          retention-days: 7

      - name: Fail job if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
